<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Forms</title>
</head>
<body>
    <h1>Forms in HTML</h1>
    <form action="/submit.php">
        <div>
            <label for="Name">Name</label>
            <input type="text" placeholder="Enter Name" required>
        </div>
        <div>
            <label for="Phone">Phone</label>
            <input type="phone" type="tel" placeholder="Enter Phone" required>
        </div>
        <div>
            <label for="Email">Email</label>
            <input type="Email" type="email" placeholder="Enter Email" required>
        </div>
        <div>
            <label for="passward">Passward</label>
            <input id="passward" type="passward" placeholder="Enter Passward" required>
        </div>

        <div>
            <label for="dob">DOB</label>
            <input id="dob" type="date" placeholder="Enter Phone" required>
        </div>
        <!--Dropdown (Select input) for Gender-->
        <div>
            <label for="Gender">Gender</label>
            <select id="gender" required>
                <option value=""disabled selected>Select Gender</option>
                <option value="male">Male</option>
                <option value="Female">Female</option>
                <option value="other">Other</option>
            </select>
        </div>
        <div>
            <p>Subscription Plan</p>
            <input id="basic" type="radio" name="Subscription" value = "Basic">
            <label for="basic">Basic</label>

            <input id="premium" type="radio" name="Subscription" value="Premium">
            <label for="premium">Premium</label>

            <input id="VIP" type="radio" name="Subscription" value="VIP">
            <label for="VIP">VIP</label>
        </div>
        
    </form>
</body>
</html>
