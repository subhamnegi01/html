<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List in HTML</title>
</head>

<body>
    <h1>List in HTML</h1>
    <h2>List of gadgets</h2>
        <!--Ordered List-->
    <ol>
        <li>Phone</li>
        <li>PC</li>
        <li>Laptop</li>
    </ol>
        <!--Unordered List-->
    <ul>
        <li>Home</li>
        <li>About</li>
    </ul>
    <h2>Programming Languages</h2>
        <!--Defination List-->
    <dl>
        <!--Definition Term-->
        </dt>Python</dt>
        <!--Definition Data-->
        <dd>A high- level, interpreted programming language known for its ease of use.</dd>
        <dt>JavaScript</dt>
        <dd>A scripting language primarily used for dynamic web pages.</dd>
    </dl>
</body>

</html>
