<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables - HTML</title>
    <style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f8f8f8;
        margin: 20px;
    }

    h1 {
        text-align: center;
        color: #333;
    }

    table {
        width: 80%;
        margin: 0 auto;
        border-collapse: collapse;
        background-color: #ffffff;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    th, td {
        padding: 12px 20px;
        border: 5px solid #dddddd;
        text-align: left;
    }

    thead {
        background-color: #460dd8;
        color: white;
    }

    tbody tr:nth-child(even) {
        background-color: #f2f2f2;
    }

    tbody tr:hover {
        background-color: #ffe5e5;
    }
</style>

</head>

<body>
    <h1>Tables in HTML</h1>
    <Table> 
        
        <thead>
            <tr>
                <th>Name</th>
                <th>Role</th>
                <th>Salary</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Rishab</td>
                <td>Software Developer</td>
                <td>$40000</td>
            </tr>
            <tr>
                <td>Rohan</td>
                <td>Web Developer</td>
                <td>$20000</td>
            </tr>
            <tr>
                <td>Shivam</td>
                <td>MI Engineer</td>
                <td>$25000</td>
            </tr>
            <tr>
                <td>Piyush</td>
                <td>Data Science</td>
                <td>$35000</td>
            </tr>
        </tbody>
    </Table>
</body>

</html>
