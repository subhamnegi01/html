<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Forms</title>
    <style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
        background: linear-gradient(to right, #667eea, #764ba2);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 2rem;
    }

    form {
        background-color: white;
        padding: 2rem;
        border-radius: 12px;
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        max-width: 400px;
        width: 100%;
    }

    h1 {
        text-align: top: 0;;
        color: white;
        margin-bottom: 2rem;
    }

    form div {
        margin-bottom: 1rem;
    }

    label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: 600;
        color: #333;
    }

    input[type="text"],
    input[type="tel"],
    input[type="email"],
    input[type="password"],
    input[type="date"],
    select {
        width: 100%;
        padding: 0.6rem;
        border: 1px solid #ccc;
        border-radius: 8px;
        transition: 0.3s;
        font-size: 1rem;
    }

    input:focus,
    select:focus {
        border-color: #667eea;
        outline: none;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
    }

    select {
        background-color: #f9f9f9;
    }

    p {
        font-weight: 600;
        color: #333;
        margin-bottom: 0.5rem;
    }

    input[type="radio"] {
        margin-right: 0.5rem;
    }

    label[for="basic"],
    label[for="premium"],
    label[for="VIP"] {
        margin-right: 1rem;
        font-weight: 700;
    }

    button {
        display: block;
        width: 100%;
        padding: 0.75rem;
        background-color: #667eea;
        color: white;
        font-weight: bold;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        margin-top: 1rem;
        transition: background-color 0.3s ease;
    }

    button:hover {
        background-color: #5a67d8;
    }
</style>

</head>
<body>
    
    <form action="/submit.php">
        <div>
            <label for="Name">Name</label>
            <input type="text" placeholder="Enter Name" required>
        </div>
        <div>
            <label for="Phone">Phone</label>
            <input type="phone" type="tel" placeholder="Enter Phone" required>
        </div>
        <div>
            <label for="Email">Email</label>
            <input type="Email" type="email" placeholder="Enter Email" required>
        </div>
        <div>
            <label for="passward">Passward</label>
            <input id="passward" type="passward" placeholder="Enter Passward" required>
        </div>

        <div>
            <label for="dob">DOB</label>
            <input id="dob" type="date" placeholder="Enter Phone" required>
        </div>
        <!--Dropdown (Select input) for Gender-->
        <div>
            <label for="Gender">Gender</label>
            <select id="gender" required>
                <option value=""disabled selected>Select Gender</option>
                <option value="male">Male</option>
                <option value="Female">Female</option>
                <option value="other">Other</option>
            </select>
        </div>
        <div>
            <p>Subscription Plan</p>
            <input id="basic" type="radio" name="Subscription" value = "Basic">
            <label for="basic">Basic</label>

            <input id="premium" type="radio" name="Subscription" value="Premium">
            <label for="premium">Premium</label>

            <input id="VIP" type="radio" name="Subscription" value="VIP">
            <label for="VIP">VIP</label>
        </div>
        <div>
            <button type="submit">Submit</button>
        </div>
        
    </form>
</body>
</html>
