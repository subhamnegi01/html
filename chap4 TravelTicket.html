<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel </title>
    <style>
        .logo {
    font-size: 2rem;
    font-weight: bold;
    color: #00796b;
    text-align: center;
    margin-bottom: 30px;
    animation: glow 2s infinite alternate;
}

@keyframes glow {
    0% {
        text-shadow: 0 0 5px #b2dfdb, 0 0 10px #80cbc4;
    }
    100% {
        text-shadow: 0 0 15px #26a69a, 0 0 30px #004d40;
    }
}

    body {
        font-family: Arial, sans-serif;
        background-color: #e0f7fa;
        margin: 0;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
    }

    form {
        background-color: #ffffff;
        padding: 30px 40px;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        width: 100%;
        max-width: 500px;
    }

    form div {
        margin-bottom: 20px;
    }

    label {
        display: block;
        margin-bottom: 6px;
        font-weight: bold;
        color: #00796b;
    }

    input, textarea {
        width: 100%;
        padding: 10px;
        border: 1px solid #b2dfdb;
        border-radius: 5px;
        font-size: 1rem;
        box-sizing: border-box;
    }

    textarea {
        resize: vertical;
        min-height: 80px;
    }

    button {
        width: 100%;
        padding: 12px;
        background-color: #00796b;
        color: white;
        font-size: 1rem;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        transition: background-color 0.3s ease;
    }

    button:hover {
        background-color: #004d40;
    }
</style>

</head>
<body>
    <body>
    <div class="logo">
        <span>🌌</span> UNIVERSE <span style="color: #004d40;">TRAVEL</span>
    </div>
    <form action="" method="get">
        <div>
            <label for="name">Name</label>
            <input id="name" type="text" placeholder="Enter your name">
        </div>
        <div>
            <label for="age">Age</label>
            <input id="age" type="Number" placeholder="Enter your Age">
        </div>
        <div>
            <label for="Phone Number">Phone Number</label>
            <input id="Phone Number" placeholder="Enter your Phone Number">
        </div>
        <div>
            <label for="Email">Email</label>
            <input id="Email" type="email" placeholder="Enter your Email">
        </div>
        <div>
            <label for="Addres">Address</label>
            <textarea name="Address" id="Add"></textarea>
        </div>
        <div>
            <button type="submit">Submit</button>
        </div>
    </form>
</body>
</html>
