<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <form>
        
        <fieldset>
            <legend>HTML for Dummy</legend>

        <label for="Name">Enter Your Name:</label>
        <input type="text" id="Name" placeholder="Enter Name">
        <br>
        <br>
        <label for="Email">Enter Your Email:</label>
        <input type="text" id="emial" placeholder="Enter Email">
        <br/>
        <br/>
        <label for="date">Enter Your DOB:</label>
        <input type="date" id="datepicker">
        <br/>
        <br/>
        <label for="selector1">Select Your Branch:</label>
        <select name="branch" id="selector1">
            <option value="cse">CSE</option>
            <option value="civil">Civil</option>
            <option value="ECE">ECE</option>
        </select>

        <br>
        <br>
        <label for="interest">Choose your interests:</label>
        <br>
        <input type="checkbox" id="coading" name="interest" value="coding">
        <label for="coading">Coading</label>
        <br>
        <input type="checkbox" id="music" name="interest" value="music">
        <label for="music">Music</label>
        <br>
        <br>
        <button>Submit</button>
        <br>
        <br>
        <label for="radio">Gender:</label>
        <br>
        <label for="radio">Male:</label>
        <input type="radio" name="radio" id="radio">
        <br>
        <label for="radio">Female:</label>
        <input type="radio" name="radio" id="radio">
        <br>
        <br>
        <label for="checkbox">Select Games:</label>
        <br>
        <input type="checkbox" id="cricket" name="game" value="cricket">
        <label for="cricket">Cricket</label>
        <br>
        <input type="checkbox" id="football" name="game" value="football">
        <label for="football">Football</label>
        <br>
        <input type="checkbox" id="hockey" name="game" value="hockey">
        <label for="hockey">Hockey</label>
        <br>
        <br>
        <label for="fileselect">Upload file:

        </label>
        <input type="file" name="fileselect" id="fileselect">
        <br>
        <br>
        <textarea name="textarea1" id="textarea1" cols="30" rows="10" placeholder="Enter Your Text Here..."></textarea>
        
        </fieldset>
    </form>
</body>
</html>
