<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cricket Score</title>
    <style>
    table {
      width: 60%;
      margin: 50px auto;
      border-collapse: collapse;
      text-align: center;
      font-family: Arial, sans-serif;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    th {
      background-color: #ff9933; /* Saffron */
      color: white;
      padding: 10px;
      font-size: 18px;
    }

    tr:nth-child(even) {
      background-color: #ffffff; /* White */
    }

    tr:nth-child(odd) {
      background-color: #f2f2f2;
    }

    td {
      padding: 12px;
      border: 1px solid #ddd;
    }

    tr:last-child {
      background-color: #138808; /* Indian Green */
      color: white;
      font-weight: bold;
    }

    tr:hover {
      background-color: #ffe0b2;
      cursor: pointer;
    }
  </style>
</head>
<body>
    <h1>Cricket Score</h1>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Run</th>
                <th>Ball</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Rohit Sharma</td>
                <td>56</td>
                <td>24</td>
            </tr>
            <tr>
                <td>Virat Kohli</td>
                <td>59</td>
                <td>29</td>
            </tr>
            <tr>
                <td>Shubhnam Gill</td>
                <td>45</td>
                <td>25</td>
            </tr>
            <tr>
                <td>KL Rahul</td>
                <td>34</td>
                <td>20</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
